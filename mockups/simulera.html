<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulera rum</title>
<style>
:root{--bg:#0d100d;--card:#151a15ee;--line:#2b332b;--tx:#e9ede6;--mut:#8f9a8b;--or:#ff7a2f;--sim:#4aa3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
body.sim #c{box-shadow:inset 0 0 0 4px var(--sim)}
.top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.top>*{pointer-events:auto}
.seg{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(8px);flex-wrap:wrap}
.seg button{background:none;border:none;color:var(--tx);border-radius:999px;padding:6px 13px;font:inherit;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--or);color:#111;font-weight:600}
.seg.sw button.on{background:#fff;color:#111}
.seg button small{opacity:.7;font-size:11.5px;margin-left:4px}
.seg button.combo{font-size:12.5px;color:var(--mut)}.seg button.combo.on{color:#111}
.seg .ed{padding:6px 9px}
.sp{flex:1}
.banner{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#0f2a44f0;border:1px solid var(--sim);color:#d8ecff;border-radius:999px;padding:7px 16px;font-size:13.5px;white-space:nowrap;display:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
body.sim .banner{display:block}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;backdrop-filter:blur(10px);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.bar button{background:#1c221c;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:7px 11px;font:13px system-ui;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar button.on{border-color:var(--sim);background:#132638}
.bar button.go{background:var(--or);border-color:var(--or);color:#111;font-weight:600}
.bar button.big{padding:9px 16px;font-size:14px}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin:3px 2px}
.bar .swc{width:22px;height:22px;border-radius:50%;border:2px solid #0008;padding:0;cursor:pointer}
.bar .swc.on{outline:2px solid #fff}
.bar input{background:#0d120d;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 10px;font:14px system-ui;width:220px}
.sub{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);display:none;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;backdrop-filter:blur(10px);max-width:calc(100% - 24px);overflow-x:auto;flex-wrap:wrap;justify-content:center}
.sub.show{display:flex}
.sub button{background:#1c221c;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:6px 10px;font:13px system-ui;cursor:pointer;white-space:nowrap}
.sub .lbl{color:var(--mut);font-size:12px;align-self:center;padding:0 4px}
.sel{position:fixed;left:0;top:0;transform:translate(-50%,-130%);display:none;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;backdrop-filter:blur(8px)}
.sel.show{display:flex}
.sel button{background:#1c221c;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:5px 9px;font:13px system-ui;cursor:pointer;white-space:nowrap}
.sel b{font-weight:600;padding:5px 6px 5px 8px;font-size:12.5px}
.rl{position:fixed;left:0;top:0;transform:translate(-50%,-50%);font-size:11.5px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px #000c;pointer-events:none;text-transform:uppercase;font-weight:600;opacity:.8}
.hint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000a;border-radius:999px;padding:6px 15px;font-size:13px;color:#dfe5dc;white-space:nowrap;transition:opacity .6s;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.hint.off{opacity:0}
#toast{position:fixed;left:50%;top:110px;transform:translate(-50%,-10px);background:#1f2a1f;border:1px solid #3c5a3c;border-radius:999px;padding:8px 16px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.who{font-size:11px;color:var(--mut);margin-left:3px}
@media (max-width:640px){.seg button{padding:5px 9px}.banner{top:auto;bottom:122px}}
</style>
</head>

  <div class="sp"></div>

  if (sel && (e.key === 'Delete' || e.key === 'Backspace')) del(sel);
});
const rot = id => edit(m => m.items[id].r = ((m.items[id].r || 0) + 90) % 360);
const del = id => { edit(m => delete m.items[id]); sel = null; };
$('#sel').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !sel) return; b.dataset.s === 'rot' ? rot(sel) : del(sel); });

// ---------- smått ----------
let hintT = 0; function hint(t) { const h = $('#hint'); h.textContent = t; h.classList.remove('off'); clearTimeout(hintT); hintT = setTimeout(() => h.classList.add('off'), 6000); }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2000); }
$('#rooms').innerHTML = ROOMS.map(r => `<div class="rl">${r[0]}</div>`).join('');
const roomEls = [...$('#rooms').children];
const P2 = v3(); function proj(p) { P2.copy(p).project(cam); return [(P2.x + 1) / 2 * innerWidth, (1 - P2.y) / 2 * innerHeight, P2.z < 1]; }

// ---------- loop ----------
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop); const dt = Math.min(.05, clock.getDelta()), k = 1 - Math.exp(-dt * 9);
  for (const id in meshes) { const g = meshes[id], t = g.userData.to; if (!t) continue;
    g.position.x += (t.x - g.position.x) * k; g.position.y += (t.y - g.position.y) * k; g.position.z += (t.z - g.position.z) * k;
    let dr = t.r - g.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); g.rotation.y += dr * k;
    const s = g.scale.x + (t.s - g.scale.x) * k; g.scale.setScalar(Math.max(.001, s)); g.visible = s > .01; }
  for (const id in wallMesh) { const W = wallMesh[id]; W.m.color.lerp(W.toCol || W.m.color, k); const ty = W.gone ? .001 : 1; W.mesh.scale.y += (ty - W.mesh.scale.y) * k; W.mesh.position.y = W.w.h * W.mesh.scale.y / 2; W.mesh.visible = W.mesh.scale.y > .01; }
  ctl.update();
  ROOMS.forEach((r, i) => { const [x, y] = proj(v3(r[1], .05, r[2])); roomEls[i].style.left = x + 'px'; roomEls[i].style.top = y + 'px'; });
  const S = $('#sel');
  if (mode === 'sim' && sel && model.items[sel] && !drag) { const it = model.items[sel], [x, y, ok] = proj(v3(it.x, 1.2, it.z)); S.innerHTML = `<b>${NAMES[it.t]}</b><button data-s="rot">⟳ Vrid</button><button data-s="del">🗑</button>`; S.style.left = x + 'px'; S.style.top = y + 'px'; S.classList.toggle('show', ok); }
  else S.classList.remove('show');
  R.render(scene, cam);
}
show(apply([]), true); renderTop(); renderBar(); loop();
hint('Hoppa mellan Nu och A uppe till vänster – eller tryck 🧪 Simulera');
window.__sim = { chg, get model() { return model; }, alts, setTab, startSim, proj: (x, y, z) => proj(v3(x, y, z)), get mode() { return mode; } };
</script>
