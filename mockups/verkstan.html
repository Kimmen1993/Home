<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verkstan</title>
<style>
:root{--bg:#0d100d;--card:#151a15ee;--line:#2b332b;--tx:#e9ede6;--mut:#8f9a8b;--or:#ff7a2f;--ok:#6fdc8c;--bad:#ff5a4a;--tip:#62b6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.top>*{pointer-events:auto}
.title{font-weight:700;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;backdrop-filter:blur(8px)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(8px)}
.tabs button{background:none;border:none;color:var(--tx);border-radius:999px;padding:5px 13px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--or);color:#111;font-weight:600}
.sp{flex:1}
.pill{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:7px 13px;font:inherit;cursor:pointer;backdrop-filter:blur(8px)}
.pill:disabled{opacity:.35;cursor:default}
.pill.ic{width:38px;padding:7px 0;font-size:16px}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;backdrop-filter:blur(10px);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.bar button{background:#1c221c;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:7px 11px;font:13px system-ui;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar button.on{border-color:var(--or);background:#2a1d14}
.bar button.go{background:var(--or);border-color:var(--or);color:#111;font-weight:600}
.bar .sw{width:14px;height:14px;border-radius:50%;border:1px solid #0006}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin:3px 2px}
.hint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000a;border-radius:999px;padding:6px 15px;font-size:13px;color:#dfe5dc;white-space:nowrap;transition:opacity .6s;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.hint.off{opacity:0}
#lab{position:fixed;left:0;top:0;pointer-events:none;background:#111d;border:1px solid #ffffff22;color:#fff;border-radius:9px;padding:4px 10px;font:600 13.5px system-ui;font-variant-numeric:tabular-nums;white-space:nowrap;transform:translate(-50%,-140%);opacity:0;transition:opacity .25s}
#lab.show{opacity:1;transition:none}
#lab .ok{color:var(--ok);font-weight:500;margin-left:6px}
#warns .w{position:fixed;left:0;top:0;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
#warns .w>i{display:block;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font:700 13px/22px system-ui;text-align:center;font-style:normal;box-shadow:0 0 0 4px #ff5a4a33;animation:pu 2.4s infinite}
#warns .w.tip>i{background:var(--tip);box-shadow:0 0 0 4px #62b6ff33;animation:none}
#warns .w>div{display:none;position:absolute;left:28px;top:-6px;width:250px;background:#151a15f4;border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35}
#warns .w.tip>div{border-left-color:var(--tip)}
#warns .w.open>div{display:block}
@keyframes pu{50%{box-shadow:0 0 0 7px #ff5a4a22}}
.matbtn{position:fixed;right:12px;top:62px}
.mat{position:fixed;right:12px;top:104px;width:330px;max-width:calc(100% - 24px);max-height:calc(100% - 190px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(10px);display:none}
.mat.show{display:block}
.mat h4{margin:0 0 2px;font-size:15px}.mat .sub{color:var(--mut);font-size:12px;margin-bottom:6px}
.mat h5{margin:12px 0 4px;font-size:10.5px;letter-spacing:.08em;color:var(--mut);font-weight:600}
.mat table{width:100%;border-collapse:collapse;font-size:12.5px}.mat td{padding:3px 0;vertical-align:top}.mat td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.mat td small{color:var(--mut);display:block}
.mat .tot td{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.mat .cut{font-size:12.5px;color:#cfd6cb;margin:0;padding-left:16px}
.mat .note{color:var(--mut);font-size:11.5px;margin-top:8px}
.pop{position:fixed;right:12px;top:62px;width:260px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;backdrop-filter:blur(10px);display:none;z-index:5}
.pop.show{display:block}
.pop button{display:block;width:100%;text-align:left;background:#1c221c;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 10px;margin:4px 0;font:13px system-ui;cursor:pointer}
.pop .e{color:var(--mut);font-size:12.5px;padding:6px}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:#1f2a1f;border:1px solid #3c5a3c;border-radius:999px;padding:8px 16px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){.title{display:none}.tabs button{padding:5px 9px}.mat{top:auto;bottom:70px}.matbtn{top:auto;bottom:70px;right:12px}.hint{bottom:118px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="title">🛠️ Verkstan</div>
  <div class="tabs" id="tabs"></div>
  <div class="sp"></div>
  <button class="pill ic" id="undo" title="Ångra (Ctrl+Z)">↶</button>
  <button class="pill ic" id="redo" title="Gör om">↷</button>
  <button class="pill" id="mine">📦 Mina saker</button>
  <button class="pill" id="save">💾 Spara</button>
</div>
<button class="pill matbtn" id="matbtn"></button>
<div class="mat" id="mat"></div>
<div class="pop" id="pop"></div>
<div class="hint" id="hint"></div>
<div id="warns"></div>
<div id="lab"></div>
<div class="bar" id="chips"></div>
<div id="toast"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
const PI = Math.PI, rad = d => d * PI / 180, deg = r => r * 180 / PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const dec = (x, n = 1) => (+x).toFixed(n).replace('.', ',');
const fm = m => dec(m, Math.abs(m - Math.round(m)) < .005 ? 0 : (Math.abs(m * 10 - Math.round(m * 10)) < .05 ? 1 : 2)) + ' m';
const kr = n => Math.round(n).toLocaleString('sv-SE') + ' kr';

// ---------- renderer ----------
const cv = $('#c');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(42, 1, .05, 300);
const ctl = new OrbitControls(cam, cv); ctl.enableDamping = true; ctl.dampingFactor = .12; ctl.maxPolarAngle = PI * .495;
function resize() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const hemi = new THREE.HemisphereLight(0xdfeaff, 0x6b5a45, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(6, 10, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, far: 40 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .02; scene.add(sun, sun.target);

// ---------- texturer ----------
function ctex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (rep) t.repeat.set(...rep); return t;
}
const grain = ctex(512, 128, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 80; i++) { g.strokeStyle = `rgba(70,45,20,${Math.random() * .14})`; g.lineWidth = Math.random() * 2 + .4; g.beginPath(); let y = Math.random() * h; g.moveTo(0, y); for (let x = 0; x <= w; x += 24) { y += (Math.random() - .5) * 2.5; g.lineTo(x, y); } g.stroke(); }
  for (let i = 0; i < 4; i++) { g.fillStyle = 'rgba(70,40,15,.12)'; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 9, 4, 0, 0, 7); g.fill(); }
});
const grass = ctex(256, 256, (g, w, h) => { g.fillStyle = '#6a8a42'; g.fillRect(0, 0, w, h); for (let i = 0; i < 5000; i++) { g.fillStyle = `hsla(${80 + Math.random() * 30},${35 + Math.random() * 25}%,${25 + Math.random() * 22}%,.5)`; g.fillRect(Math.random() * w, Math.random() * h, 1.5, 3); } }, [60, 60]);
const sky = ctex(16, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#7fb2e6'); gr.addColorStop(.65, '#cfe2f1'); gr.addColorStop(1, '#eef2ea'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const oak = ctex(1024, 1024, (g, w, h) => {
  const pw = 128, ph = 1024 / 6; for (let r = 0; r < 8; r++) for (let k = -1; k < 7; k++) { const off = (r % 3) * ph / 3; g.fillStyle = `hsl(${32 + Math.random() * 5},${38 + Math.random() * 8}%,${58 + Math.random() * 9}%)`; g.fillRect(r * pw, k * ph + off, pw - 2, ph - 2); }
  g.globalAlpha = .5; g.drawImage(grain.image, 0, 0, 1024, 1024); g.globalAlpha = 1;
}, [3, 3]);
const panel = ctex(256, 256, (g, w, h) => { g.fillStyle = '#e9e5dc'; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 32) { g.fillStyle = '#cfcabd'; g.fillRect(x, 0, 3, h); g.fillStyle = '#f4f1ea'; g.fillRect(x + 3, 0, 2, h); } }, [8, 1]);
const screenTex = ctex(512, 288, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#1e3d7a'); gr.addColorStop(.55, '#f08a4b'); gr.addColorStop(.7, '#ffd08a'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffe9b0'; g.beginPath(); g.arc(w * .62, h * .62, 26, 0, 7); g.fill();
  g.fillStyle = '#2a2140'; g.beginPath(); g.moveTo(0, h); g.lineTo(0, h * .7); g.lineTo(w * .22, h * .52); g.lineTo(w * .4, h * .68); g.lineTo(w * .6, h * .55); g.lineTo(w * .82, h * .72); g.lineTo(w, h * .6); g.lineTo(w, h); g.fill();
  g.fillStyle = '#140f22'; g.fillRect(0, h * .86, w, h);
});

const matCache = {};
const woodMat = col => matCache[col] ??= new THREE.MeshStandardMaterial({ color: col, map: grain, roughness: .78 });
const plain = (col, o = {}) => new THREE.MeshStandardMaterial({ color: col, roughness: .85, ...o });

// instansierade brädor: lokal x = längdriktning (ådringen följer brädan)
const UNIT = new THREE.BoxGeometry(1, 1, 1);
class Boxes {
  constructor(parent, mat, max = 2500) { this.m = new THREE.InstancedMesh(UNIT, mat, max); this.m.castShadow = this.m.receiveShadow = true; this.m.frustumCulled = false; this.m.count = 0; this.n = 0; parent.add(this.m); }
  reset() { this.n = 0; return this; }
  add(x, y, z, lx, ly, lz, ry = 0, rz = 0) {
    if (this.n >= this.m.instanceMatrix.count) return;
    Boxes.q.setFromEuler(Boxes.e.set(0, ry, rz, 'YZX'));
    Boxes.M.compose(Boxes.p.set(x, y, z), Boxes.q, Boxes.s.set(lx, ly, lz)); this.m.setMatrixAt(this.n++, Boxes.M);
  }
  done() { this.m.count = this.n; this.m.instanceMatrix.needsUpdate = true; }
}
Boxes.q = new THREE.Quaternion(); Boxes.e = new THREE.Euler(); Boxes.M = new THREE.Matrix4(); Boxes.p = v3(); Boxes.s = v3();

// ---------- magnetiskt fäste ----------
// grid i cm; mag = [[värde, 'text'], ...]; free (Shift) = hela cm utan magneter
function snap(v, { grid = 5, mag = [], free = false, r = 2.5 } = {}) {
  if (free) return { v: Math.round(v), m: null };
  for (const [mv, t] of mag) if (Math.abs(v - mv) <= r) return { v: mv, m: t };
  return { v: Math.round(v / grid) * grid, m: null };
}

// ---------- kapning: lägg bitarna i så få inköpslängder som möjligt ----------
function pack(pieces, stocks, kerf = .4) {
  const max = stocks.at(-1), bins = []; let joints = 0;
  for (let p of [...pieces].sort((a, b) => b - a)) {
    while (p > max + .01) { bins.push({ s: max, used: max, cuts: [max] }); p -= max; joints++; }
    let b = bins.find(b => b.s - b.used >= p - .01);
    if (!b) { b = { s: max, used: 0, cuts: [] }; bins.push(b); }
    b.used += p + kerf; b.cuts.push(p);
  }
  for (const b of bins) b.s = stocks.find(s => s >= b.used - kerf - .01) ?? max;
  const by = {}; for (const b of bins) by[b.s] = (by[b.s] || 0) + 1;
  const meters = bins.reduce((a, b) => a + b.s, 0) / 100, waste = bins.reduce((a, b) => a + Math.max(0, b.s - b.used), 0) / 100;
  return { txt: Object.keys(by).sort((a, b) => b - a).map(s => `${by[s]} st × ${fm(s / 100)}`).join(', '), meters, waste, joints, n: bins.length };
}
const cutLines = (label, pieces) => { const by = {}; for (const p of pieces) { const k = Math.round(p); by[k] = (by[k] || 0) + 1; } return Object.keys(by).sort((a, b) => b - a).map(k => `${label}: ${by[k]} × ${k} cm`); };

// ---------- handtag ----------
const SPH = new THREE.SphereGeometry(1, 24, 16), CONE = new THREE.ConeGeometry(.6, 1.3, 18), RING = new THREE.TorusGeometry(1.9, .2, 8, 40), PICK = new THREE.SphereGeometry(2.6, 10, 8);
const PICKM = new THREE.MeshBasicMaterial({ visible: false });
const hmat = (o = 1) => new THREE.MeshBasicMaterial({ color: 0xff7a2f, depthTest: false, transparent: true, opacity: o });
function handle(root, o) {
  if (o.kind === 'click') return o;
  const g = new THREE.Group(), s = new THREE.Mesh(SPH, hmat()); s.renderOrder = 20; g.add(s);
  const w = new THREE.Mesh(new THREE.SphereGeometry(.42, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false })); w.renderOrder = 21; g.add(w);
  if (o.axis) for (const sg of o.both ? [1, -1] : [1]) {
    const d = o.axis.clone().multiplyScalar(sg), c = new THREE.Mesh(CONE, hmat(.9)); c.renderOrder = 20;
    c.position.copy(d.clone().multiplyScalar(2.3)); c.quaternion.setFromUnitVectors(v3(0, 1, 0), d); g.add(c);
  }
  if (o.kind === 'plane') { const r = new THREE.Mesh(RING, hmat(.75)); r.renderOrder = 20; r.quaternion.setFromUnitVectors(v3(0, 0, 1), o.normal); g.add(r); }
  const p = new THREE.Mesh(PICK, PICKM); g.add(p);
  o.g = g; o.pick = p; o.sph = s; root.add(g); return o;
}

// ---------- gemensamt ----------
const ray = new THREE.Raycaster(), mp = new THREE.Vector2();
function setRay(e) { const r = cv.getBoundingClientRect(); mp.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(mp, cam); }
const hitPlane = pl => ray.ray.intersectPlane(pl, v3());
const plane = (n, p) => new THREE.Plane().setFromNormalAndCoplanarPoint(n, p);

// =====================================================================
// 🪑 BÄNK – byggd av riktigt virke: trall 28×120 + regel 45×95
// =====================================================================
const BMAT = { imp: ['Impregnerad', '#b49b6b', 28, 32, null], ek: ['Ek, oljad', '#a8794b', 190, 240, ['Träolja 1 L', 249]], svart: ['Svartmålad', '#2b2a28', 28, 32, ['Täckfärg svart 1 L', 390]], gra: ['Grålaserad', '#9c9a91', 28, 32, ['Lasyr grå 1 L', 349]] };
const SLAT = 12, GAP = .8, depthOf = n => n * SLAT + (n - 1) * GAP;
const TRALL = [300, 360, 420, 480, 540], REGEL = [240, 300, 360, 420, 480, 540];
const bank = {
  key: 'bank', tab: '🪑 Bänk', hint: 'Dra i de orange prickarna · håll Shift för fritt',
  s: { L: 180, n: 3, H: 45, B: 0, mat: 'imp' },
  cam: [[1.75, 1.25, 2.5], [-.1, .38, -.15]],
  light() { scene.background = sky; hemi.intensity = 1; hemi.groundColor.set('#6b5a45'); sun.intensity = 2.4; sun.position.set(5, 9, 6); },
  setup() {
    const r = this.root = new THREE.Group();
    const gr = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), plain('#ffffff', { map: grass })); gr.rotation.x = -PI / 2; gr.position.y = -.03; gr.receiveShadow = true; r.add(gr);
    const deck = new Boxes(r, woodMat('#a68a5e'), 40);
    for (let z = -.6; z < 2.6; z += .126) deck.add(.2, -.014, z + .06, 5.2, .028, .12); deck.done();
    const wall = new THREE.Mesh(new THREE.BoxGeometry(7, 3, .2), plain('#ffffff', { map: panel })); wall.position.set(.2, 1.5, -.72); wall.receiveShadow = wall.castShadow = true; r.add(wall);
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.2, .05), plain('#7f9db3', { roughness: .1, metalness: .2 })); win.position.set(1.8, 1.65, -.61); r.add(win);
    const fr = new THREE.Mesh(new THREE.BoxGeometry(1.24, 1.34, .04), plain('#f4f2ec')); fr.position.set(1.8, 1.65, -.63); r.add(fr);
    this.wood = new Boxes(r, woodMat('#ffffff'));
    const H = this.handles = [], hr = this.hroot = new THREE.Group(); r.add(hr);
    const g = () => this.geo;
    H.push(handle(hr, { kind: 'axis', axis: v3(1, 0, 0), at: () => v3(g().x1 + .07, g().H - .014, g().zm), get: () => this.s.L,
      set: (v, f) => { const r = snap(v, { free: f, mag: [120, 180, 240, 300, 360, 420, 480, 540].map(x => [x, '✓ inget spill']) }); this.s.L = clamp(r.v, 60, 600); return { t: `Längd ${this.s.L} cm`, ok: r.m }; } }));
    H.push(handle(hr, { kind: 'axis', axis: v3(0, 0, 1), at: () => v3(g().xm, g().H - .014, g().zf + .07), get: () => depthOf(this.s.n),
      set: v => { this.s.n = clamp(Math.round((v + GAP) / (SLAT + GAP)), 2, 5); return { t: `Djup ${dec(depthOf(this.s.n))} cm · ${this.s.n} brädor` }; } }));
    H.push(handle(hr, { kind: 'axis', axis: v3(0, 1, 0), at: () => v3(g().x0 + .03, g().H + .06, g().zf - .03), get: () => this.s.H,
      set: (v, f) => { const r = snap(v, { grid: 1, free: f, mag: [[45, '✓ standard'], [42, '✓ bekväm']], r: 1.4 }); this.s.H = clamp(r.v, 30, 75); return { t: `Sitthöjd ${this.s.H} cm`, ok: r.m }; } }));
    H.push(handle(hr, { kind: 'axis', axis: v3(0, 1, 0), at: () => v3(g().xm, g().H + this.s.B / 100 + .07, g().zr + .12), get: () => this.s.B,
      set: (v, f) => { let r = snap(v, { free: f, mag: [[35, '✓ skönt för ryggen']] }); if (r.v < 10) r = { v: 0, m: null }; this.s.B = clamp(r.v, 0, 50); return { t: this.s.B ? `Ryggstöd ${this.s.B} cm` : 'Ingen rygg – dra upp', ok: r.m }; } }));
  },
  build() {
    const s = this.s, L = s.L / 100, H = s.H / 100, D = depthOf(s.n) / 100, B = s.B / 100;
    const x0 = -.9, x1 = x0 + L, zr = -.42, zf = zr + D, xm = (x0 + x1) / 2, zm = (zr + zf) / 2;
    this.geo = { x0, x1, xm, zr, zf, zm, H };
    const W = this.wood.reset(); W.m.material = woodMat(BMAT[s.mat][1]);
    for (let i = 0; i < s.n; i++) W.add(xm, H - .014, zr + i * (SLAT + GAP) / 100 + .06, L, .028, .12);
    const span = L - .12, nf = Math.max(2, Math.ceil(span / .8) + 1), xs = [...Array(nf)].map((_, i) => x0 + .06 + span * i / (nf - 1));
    const rearTop = B > 0 ? H + B : H - .028;
    for (const x of xs) {
      W.add(x, H - .028 - .0475, zm, D - .02, .095, .045, -PI / 2);
      W.add(x, (H - .028) / 2, zf - .06, H - .028, .045, .095, 0, PI / 2);

    this.hroot = new THREE.Group(); r.add(this.hroot);
    const s = () => this.s, H = this.handles = [], flip = () => s().type === 'flip', sz = () => TVS[s().size];
    H.push(handle(this.hroot, { kind: 'plane', normal: v3(0, 1, 0), show: flip, plane: () => plane(v3(0, 1, 0), v3(0, HY, 0)), at: () => v3(s().mx, HY - .06, s().mz),
      move: (p, f) => { const r = snap(p.z * 100, { free: f }); s().mz = clamp(r.v, 15, 380) / 100; s().mx = clamp(snap(p.x * 100, { free: f }).v, -150, 150) / 100; return { t: `Fäste ${s().mz * 100 | 0} cm från väggen` }; } }));
    H.push(handle(this.hroot, { kind: 'axis', axis: v3(0, -1, 0), both: true, show: () => flip() && this.disp > .99, at: () => v3(s().mx, HY - s().L / 100 - sz()[1] - .07, s().mz + .04), get: () => s().L,
      set: (v, f) => { const r = snap(v, { free: f, grid: 5 }); s().L = clamp(r.v, 0, 60); const c = Math.round((HY - s().L / 100 - .02 - sz()[1] / 2) * 100); return { t: `Nedfällning ${s().L} cm · tv-mitt ${c} cm` }; } }));
    H.push(handle(this.hroot, { kind: 'plane', normal: v3(0, 1, 0), plane: () => plane(v3(0, 1, 0), v3(0, 2.0, 0)), at: () => v3(s().lamp[0], 1.9, s().lamp[1]),
      move: (p, f) => { s().lamp = [clamp(snap(p.x * 100, { free: f }).v, -200, 200) / 100, clamp(snap(p.z * 100, { free: f }).v, 20, 440) / 100]; return { t: `Lampa ${dec(s().lamp[1], 2)} m från väggen` }; } }));
    H.push(handle(this.hroot, { kind: 'plane', normal: v3(0, 0, 1), show: () => !flip(), plane: () => plane(v3(0, 0, 1), v3(0, 0, .03)), at: () => v3(s().amx, s().amy / 100 + sz()[1] / 2 + .09, .04),
      move: (p, f) => { s().amx = clamp(snap(p.x * 100, { free: f }).v, -150, 150) / 100; const r = snap((p.y - sz()[1] / 2 - .09) * 100, { free: f, mag: [[110, '✓ ögonhöjd i soffan']], r: 3 }); s().amy = clamp(r.v, 60, 200); return { t: `Tv-mitt ${s().amy} cm`, ok: r.m }; } }));

      set: (v, f) => { const r = snap(v, { free: f }); s().e = clamp(r.v, 0, 60); return { t: `Ut ${s().e} cm från väggen${s().e === 60 ? ' · armens max' : ''}` }; } }));
    H.push(handle(this.hroot, { kind: 'plane', normal: v3(0, 1, 0), show: () => !flip() && this.disp > .99, plane: () => plane(v3(0, 1, 0), v3(0, s().amy / 100, 0)),
      at: () => { const a = rad(s().a), d = sz()[0] / 2 + .08, pz = .06 + s().e / 100; return v3(s().amx + Math.cos(a) * d, s().amy / 100, pz - Math.sin(a) * d); },
      move: (p, f) => { const pz = .06 + s().e / 100, A = deg(Math.atan2(-(p.z - pz), p.x - s().amx)), toward = Math.round(deg(Math.atan2(EYE.x - s().amx, EYE.z - pz)));
        const r = snap(-A, { free: f, grid: 1, mag: [[toward, '✓ mot soffan'], [0, 'rakt fram']], r: 3 }); s().a = clamp(r.v, -60, 60); return { t: `Vridning ${Math.abs(s().a)}°`, ok: r.m }; } }));

  },
  toggle() { this.s.open = this.s.open ? 0 : 1; renderChips(); },
  tick(dt) {

  },
  build(animOnly) {
    const s = this.s, [w, h] = TVS[s.size], p = this.disp;
    this.lamp.position.set(s.lamp[0], 0, s.lamp[1]);
    this.tvm.scale.set(w, h, .05);
    if (s.type === 'flip') {
      this.plate.scale.set(.5, .08, .42); this.plate.position.set(s.mx, CEIL - .04, s.mz);
      this.hinge.position.set(s.mx, HY, s.mz); this.hinge.rotation.set(-(1 - p) * PI / 2, 0, 0);
      const L = s.L / 100 + .02; this.arm.scale.set(.06, L, .03); this.arm.position.set(0, -L / 2, .01);
      this.swv.position.set(0, -L, 0); this.swv.rotation.set(0, 0, 0); this.tvm.position.set(0, -h / 2, .035);
    } else {
      const q = p, e = s.e / 100 * Math.min(1, q * 2), a = rad(s.a) * Math.max(0, q * 2 - 1);
      this.plate.scale.set(.42, .42, .025); this.plate.position.set(s.amx, s.amy / 100, .0125);
      this.hinge.position.set(s.amx, s.amy / 100, 0); this.hinge.rotation.set(0, 0, 0);
      this.arm.scale.set(.07, .05, e + .06); this.arm.position.set(0, 0, (e + .06) / 2);
      this.swv.position.set(0, 0, e + .06); this.swv.rotation.set(0, a, 0); this.tvm.position.set(0, 0, .03);
    }
    this.scr.emissiveIntensity = s.type === 'flip' ? Math.max(0, (p - .85) / .15) : .25 + .75 * p;

  },
  // kollar hela rörelsen, inte bara slutläget
  check() {
    const s = this.s, [w, h, kg] = TVS[s.size], W = this.warn = [], cm = m => Math.max(5, Math.ceil(m * 20) * 5) + ' cm';
    let hit = false;
    if (s.type === 'flip') {
      const L = s.L / 100 + .02, R = L + h, [lx, lz] = s.lamp;
      if (Math.abs(lx - s.mx) < w / 2 + .22) {
        for (let d = 0; d <= 90 && !hit; d += 1.5) for (let r = 0; r <= R; r += .02) {
          const z = s.mz + r * Math.sin(rad(d)), y = HY - r * Math.cos(rad(d));
          if ((Math.abs(z - lz) < .05 && y > 2.12) || (Math.abs(z - lz) < .24 && y > 1.93 && y < 2.16)) { hit = true; break; }
        }
      }
      if (hit) {
        const side = w / 2 + .23 - Math.abs(lx - s.mx), fwd = s.mz + R + .25 - lz;
        W.push({ p: v3(lx, 2.2, lz), k: 'bad', t: `Tv:n slår i taklampan när den fälls upp. Flytta lampan ${cm(side)} åt sidan${fwd > 0 && lz + fwd < 4.4 ? ` – eller ${cm(fwd)} mot soffan` : ''}.` });
      }
      if (s.size === 75) W.push({ p: v3(s.mx + .3, CEIL - .1, s.mz), k: 'bad', t: 'De flesta motoriserade takfästen klarar max ca 65–70 tum. 75" kräver ett tyngre specialfäste.' });
      const c = Math.round((HY - L - h / 2) * 100);
      if (c > 150) W.push({ p: v3(s.mx - w / 2 - .1, HY - L - h / 2, s.mz), k: 'tip', t: `Tv-mitten hamnar på ${c} cm – högt för soffan (bra är ca 100–120). Passar bäst i sovrum där man halvligger.` });
    } else {
      const pz = .06 + s.e / 100, need = w / 2 * Math.sin(Math.abs(rad(s.a))) - .06 + .02, y0 = s.amy / 100 - h / 2;
      if (s.e / 100 < need) W.push({ p: v3(s.amx + Math.sign(s.a || 1) * w / 2, s.amy / 100, .1), k: 'bad', t: `Tv:n slår i väggen när du vrider den ${Math.abs(s.a)}°. Dra ut armen minst ${cm(need)}.` });
      let shelf = false;
      for (let q = 0; q <= 1 && !shelf; q += .05) {
        const e = s.e / 100 * Math.min(1, q * 2), a = rad(s.a) * Math.max(0, q * 2 - 1), z0 = .06 + e;
        for (let u = -.5; u <= .5; u += .05) { const x = s.amx + Math.cos(a) * u * w, z = z0 - Math.sin(a) * u * w; if (y0 < 1.9 && x > -2.03 && x < -1.37 && z < .37) { shelf = true; break; }
          if (Math.abs(x) > 2.18) { shelf = 'wall'; break; } }
      }
      if (shelf) W.push({ p: v3(-1.7, 1.95, .3), k: 'bad', t: shelf === 'wall' ? 'Tv:n går in i sidoväggen – flytta fästet in mot mitten.' : 'Tv:n slår i bokhyllan när armen rör sig – flytta fästet åt höger.' });
      if (s.amy > 130) W.push({ p: v3(s.amx - w / 2 - .1, s.amy / 100, .1), k: 'tip', t: `Tv-mitten på ${s.amy} cm är lite högt för soffan – ca 110 cm är skönt för nacken.` });

    const tz = s.type === 'flip' ? s.mz : .06 + s.e / 100, dist = Math.hypot(EYE.z - tz, EYE.x - (s.type === 'flip' ? s.mx : s.amx)), dg = s.size * .0254, lo = dg * 1.2, hi = dg * 1.6;

    this.shade.material.color.set(hit ? '#c0392b' : '#2f3a33');
  },
  title() { return `Tv-fäste ${this.s.type === 'flip' ? 'från tak' : 'med arm'} ${this.s.size}"`; },
  mat() {
    const s = this.s, kg = TVS[s.size][2];
    const rows = s.type === 'flip'
      ? [['Motoriserat takfäste, fäll-ned', 'för 32–70", fjärrkontroll', 7500], ['Eluttag i taket', 'elektriker', 2500], ['Kabel ström + HDMI i tak', '5 m', 450], ['Regel/förstärkning i bjälklaget', '45×95', 120]]

    return { h: this.title(), sub: `Tv ${s.size}" ≈ ${dec(TVS[s.size][0], 2)} × ${dec(TVS[s.size][1], 2)} m, ${kg} kg`, groups: [['Att köpa', rows]], cut: [],
      note: s.type === 'flip' ? 'Motorfästet ska skruvas i bjälke eller förstärkning – inte bara i gipsen. Ca-priser.' : `${kg} kg + arm ger stor hävarm – skruva i regel, eller använd plugg för tung last i gips. Ca-priser.` };
  },

      + [55, 65, 75].map(n => `<button data-c="size|${n}" class="${s.size === n ? 'on' : ''}">${n}"</button>`).join('') + '<span class="sep"></span>'

// =====================================================================
// ramverk: lägen, drag, ångra, etiketter, varningar
// =====================================================================
const MODES = [bank, staket, tv];
let cur = null, drag = null, down = null, hov = null, matOpen = false;
for (const m of MODES) { m.U = []; m.Rd = []; }

function setMode(m) {
  if (cur) cur.root.visible = false;
  cur = m; if (!m.root) { m.setup(); scene.add(m.root); }
  m.root.visible = true; m.light();
  cam.position.set(...m.cam[0]); ctl.target.set(...m.cam[1]); ctl.update();
  $('#tabs').innerHTML = MODES.map(x => `<button data-m="${x.key}" class="${x === m ? 'on' : ''}">${x.tab}</button>`).join('');
  clearTimeout(labT); lab.classList.remove('show'); labAt = null; rebuild(); renderChips(); updUndo();
  setHint(m.key === 'staket' && !m.s.drawing ? 'Dra i hörnen eller höjden · byt typ och färg nedan' : m.hint, !m.dragged);
  cv.style.cursor = m.key === 'staket' && m.s.drawing ? 'crosshair' : '';
}
function rebuild() { cur.build(); renderWarn(); renderMat(); }

// --- etikett som följer det man drar ---
const lab = $('#lab'); let labAt = null, labT = 0;
function showLab(o, at, keep) { lab.innerHTML = `${o.t}${o.ok ? `<span class="ok">${o.ok}</span>` : ''}`; lab.classList.add('show'); labAt = at; clearTimeout(labT); }
function hideLab(ms = 700) { clearTimeout(labT); labT = setTimeout(() => { lab.classList.remove('show'); }, ms); }
const P2 = v3();
function proj(p) { P2.copy(p).project(cam); return [(P2.x + 1) / 2 * innerWidth, (1 - P2.y) / 2 * innerHeight, P2.z < 1]; }

// --- varningsprickar ---
let warnEls = [], openW = new Set();
function renderWarn() {
  const W = cur.warn || [], box = $('#warns');
  box.innerHTML = W.map((w, i) => `<div class="w ${w.k}${openW.has(w.t.slice(0, 30)) ? ' open' : ''}" data-w="${i}"><i>${w.k === 'tip' ? 'i' : '!'}</i><div>${w.t}</div></div>`).join('');
  warnEls = [...box.children].map((el, i) => [el, W[i].p]);
}
$('#warns').addEventListener('click', e => { const el = e.target.closest('.w'); if (!el) return; el.classList.toggle('open'); const k = (cur.warn[+el.dataset.w]?.t || '').slice(0, 30); el.classList.contains('open') ? openW.add(k) : openW.delete(k); });

// --- material ---
function renderMat() {
  const m = cur.mat(), tot = m.groups.reduce((a, [, rows]) => a + rows.reduce((b, r) => b + r[2], 0), 0);
  $('#matbtn').innerHTML = `📦 ${tot ? 'ca ' + kr(tot) : 'Material'} ${matOpen ? '▴' : '▾'}`;
  const el = $('#mat'); el.classList.toggle('show', matOpen); if (!matOpen) return;
  el.innerHTML = `<h4>${m.h}</h4><div class="sub">${m.sub}</div>` + m.groups.map(([t, rows]) => `<h5>${t.toUpperCase()}</h5><table>${rows.map(r => `<tr><td>${r[0]}<small>${r[1]}</small></td><td>${kr(r[2])}</td></tr>`).join('')}<tr class="tot"><td>Totalt ca</td><td>${kr(tot)}</td></tr></table>`).join('')
    + (m.cut.length ? `<h5>KAPLISTA</h5><ul class="cut">${m.cut.map(c => `<li>${c}</li>`).join('')}</ul>` : '') + (m.note ? `<div class="note">${m.note}</div>` : '');
}
$('#matbtn').onclick = () => { matOpen = !matOpen; $('#pop').classList.remove('show'); renderMat(); };

// --- knappar ---
function renderChips() { $('#chips').innerHTML = cur.chips(); }
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if (!b) return; const [k, v] = b.dataset.c.split('|'), before = JSON.stringify(cur.s);
  if (cur.chip(k, v) && JSON.stringify(cur.s) !== before) pushUndo(before);
  rebuild(); renderChips();
  if (cur === staket) cv.style.cursor = staket.s.drawing ? 'crosshair' : '';
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) setMode(MODES.find(m => m.key === b.dataset.m)); });

let hintT = 0;
function setHint(t, show = true) { const h = $('#hint'); h.textContent = t; h.classList.toggle('off', !show); clearTimeout(hintT); if (show) hintT = setTimeout(() => h.classList.add('off'), 9000); }

// --- ångra ---
function pushUndo(before) { cur.U.push(before); if (cur.U.length > 150) cur.U.shift(); cur.Rd.length = 0; updUndo(); }
function updUndo() { $('#undo').disabled = !cur.U.length; $('#redo').disabled = !cur.Rd.length; }
function undoRedo(from, to) { const b = from.pop(); if (b == null) return; to.push(JSON.stringify(cur.s)); cur.s = JSON.parse(b); cur.restored?.(); rebuild(); renderChips(); updUndo(); }
$('#undo').onclick = () => undoRedo(cur.U, cur.Rd); $('#redo').onclick = () => undoRedo(cur.Rd, cur.U);
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? undoRedo(cur.Rd, cur.U) : undoRedo(cur.U, cur.Rd); return; }
  if (e.key === 'Escape') { $('#pop').classList.remove('show'); }
  cur.onKey?.(e);
});

// --- mina saker ---
const LS = 'verkstan.mina';
const loadMine = () => { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); }
$('#save').onclick = () => {
  const L = loadMine(); L.unshift({ k: cur.key, n: cur.title(), s: JSON.parse(JSON.stringify(cur.s)) });
  try { localStorage.setItem(LS, JSON.stringify(L.slice(0, 30))); } catch {}
  toast(`💾 Sparad i Mina saker: ${cur.title()}`);
};
$('#mine').onclick = () => {
  const L = loadMine(), p = $('#pop'); matOpen = false; renderMat();
  p.innerHTML = L.length ? L.map((x, i) => `<button data-i="${i}">${MODES.find(m => m.key === x.k)?.tab.split(' ')[0] || ''} ${x.n}</button>`).join('') : '<div class="e">Inget sparat än. Tryck 💾 Spara så hamnar det här – och kan användas i förslagen sen.</div>';
  p.classList.toggle('show');
};
$('#pop').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const x = loadMine()[+b.dataset.i], m = MODES.find(m => m.key === x.k);
  m.s = JSON.parse(JSON.stringify(x.s)); if (m.root) m.restored?.(); $('#pop').classList.remove('show'); setMode(m); });

// --- pekare ---
function pickHandle() {
  const L = (cur.handles || []).filter(h => h.g && h.g.visible);
  const hit = ray.intersectObjects(L.map(h => h.pick), false)[0]; return hit && L.find(h => h.pick === hit.object);
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  setRay(e); const h = pickHandle();
  if (h) {
    e.stopImmediatePropagation(); ctl.enabled = false; cv.setPointerCapture(e.pointerId);
    const d = drag = { h, before: JSON.stringify(cur.s) };
    if (h.kind === 'axis') {
      d.o = h.at().clone(); d.ax = h.axis.clone(); const cd = cam.getWorldDirection(v3());
      let n = d.ax.clone().cross(cd).cross(d.ax); if (n.lengthSq() < 1e-6) n = cd; d.plane = plane(n.normalize(), d.o);
      const p = hitPlane(d.plane); d.t0 = p ? p.sub(d.o).dot(d.ax) : 0; d.v0 = h.get();
    } else d.plane = h.plane();
    cv.style.cursor = 'grabbing'; cur.dragged = true; $('#hint').classList.add('off');
    return;
  }
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
}, { capture: true });
cv.addEventListener('pointermove', e => {
  setRay(e);
  if (drag) {
    const p = hitPlane(drag.plane); if (!p) return; let o;
    if (drag.h.kind === 'axis') o = drag.h.set(drag.v0 + (p.clone().sub(drag.o).dot(drag.ax) - drag.t0) * 100, e.shiftKey);
    else o = drag.h.move(p, e.shiftKey);
    rebuild(); showLab(o, drag.h.at); return;
  }
  if (e.buttons) return;
  hov = pickHandle();
  if (cur.hover && cur.s.drawing) { cur.hover(e); return; }
  const clickable = !hov && (cur.handles || []).some(h => h.kind === 'click' && ray.intersectObject(h.pick, false).length);
  cv.style.cursor = hov ? 'grab' : clickable ? 'pointer' : '';
});
addEventListener('pointerup', e => {
  if (drag) {
    if (JSON.stringify(cur.s) !== drag.before) pushUndo(drag.before);
    drag = null; ctl.enabled = true; hideLab(); cv.style.cursor = hov ? 'grab' : ''; renderChips(); return;
  }
  if (down && e.target === cv && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 450) {
    setRay(e);
    const c = (cur.handles || []).find(h => h.kind === 'click' && ray.intersectObject(h.pick, false).length);
    if (c) c.click(); else cur.click?.(e);
  }
  down = null;
});
cv.addEventListener('dblclick', () => cur.dbl?.());
cv.addEventListener('pointerleave', () => { if (cur === staket && staket.s.drawing) { staket.cursor = null; staket.ghost.visible = false; hideLab(0); rebuild(); } });

// --- loop ---
const clock = new THREE.Clock();
function loop() {
